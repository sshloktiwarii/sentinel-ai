[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "sentinel-ai"
version = "1.0.0"
dependencies = [
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "httpx2>=0.28.2",
    "rumps>=0.4.0",
    "starlette>=0.46.2",
    "uvicorn>=0.30.0",
    "websockets>=15.0.1",
]

[project.scripts]
sentinel = "sentinel.server:start"
sentinel-bar = "sentinel.menubar:main"
sentinel-service = "sentinel.service:main"


[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "anyio>=4.15.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
exclude = ["tests*", "scripts*", "web*"]

# Ensure pre-built static Next.js frontend assets are packaged with the distribution
# Populated via: npm --prefix web run build
[tool.setuptools.package-data]
sentinel = [
    "web_dist/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
