[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "sentinel-ai"
version = "0.1.0"
dependencies = [
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "httpx2>=0.28.2",
    "rumps>=0.4.0",
    "starlette>=0.46.2",
    "websockets>=15.0.1",
]

[project.scripts]
sentinel-bar = "sentinel.menubar:main"
sentinel-service = "sentinel.service:main"


[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "anyio>=4.15.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
